<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servidor Nocturno · Nightdare Games</title>
<link rel="icon" href="assets/img/nyder_logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="screen" width="480" height="270"></canvas>

  <div id="hud" hidden>
    <div class="hud-l">
      <div id="hud-phase"></div>
      <div class="hud-row"><div id="hud-hearts"></div><div id="hud-lemons"></div></div>
    </div>
    <div class="hud-r"><div class="obj-label">OBJETIVO</div><div id="hud-obj"></div></div>
    <div class="hud-btns">
      <button id="btn-notebook" title="Libreta de estudio (L)">📓</button>
      <button id="btn-sound" title="Sonido (M)">🔊</button>
      <button id="btn-menu" title="Pausa (Esc)">☰</button>
    </div>
  </div>

  <div id="title" hidden>
    <div class="t-studio"><img src="assets/img/nyder_logo.png" alt=""> NIGHTDARE GAMES presenta</div>
    <h1>SERVIDOR<br><span>NOCTURNO</span></h1>
    <p class="t-sub">Una aventura para estudiar Bases de Datos II · Examen 3</p>
  </div>

  <div id="splash" hidden>
    <img src="assets/img/nyder_logo.png" alt="Logo de Nightdare Games">
    <div class="sp-name">NIGHTDARE <span>GAMES</span></div>
  </div>

  <div id="press" hidden>
    <div class="press-box">
      <img src="assets/img/nyder_logo.png" alt="">
      <p>Presione cualquier tecla o haga clic para empezar</p>
      <small>Recomendado: pantalla completa (F11) y sonido encendido</small>
    </div>
  </div>

  <div id="layer"></div>
  <div id="toast"></div>
  <pre id="autotest" hidden></pre>
</div>

<script src="js/content.js"></script>
<script src="js/logic.js"></script>
<script src="js/maps.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/minigames.js"></script>
<script src="js/game.js"></script>
</body>
</html>
