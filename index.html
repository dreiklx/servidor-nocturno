<body>
<div id="stage">
  <canvas id="screen" width="480" height="270"></canvas>

  <div id="hud" hidden>
    <div class="hud-l">
      <div id="hud-phase"></div>
      <div class="hud-row"><div id="hud-hearts"></div><div id="hud-lemons"></div></div>
    </div>
    <div class="hud-r"><div class="obj-label">OBJETIVO</div><div id="hud-obj"></div><div id="hud-list"></div></div>
    <div class="hud-btns">
      <button id="btn-notebook" title="Libreta de estudio (L)" aria-label="Libreta de estudio"><i class="ic ic-book"></i></button>
      <button id="btn-sound" title="Sonido (M)" aria-label="Sonido"><i class="ic ic-sound"></i></button>
      <button id="btn-menu" title="Pausa (Esc)" aria-label="Pausa"><i class="ic ic-menu"></i></button>
    </div>
  </div>

  <div id="title" hidden>
    <div class="t-studio"><img src="assets/img/nyder_logo.png" alt=""> NYDER GAMES presenta</div>
    <h1>SERVIDOR<br><span>NOCTURNO</span></h1>
    <p class="t-sub">Una aventura para estudiar Bases de Datos II · Examen 3</p>
    <p class="t-copy">© NYDER Games</p>
  </div>

  <div id="splash" hidden><canvas id="splash-cv" width="1280" height="720" aria-label="NYDER Games"></canvas></div>

  <div id="press" hidden>
    <div class="press-box">
      <img src="assets/img/nyder_logo.png" alt="">
      <p>Toque la pantalla o presione una tecla</p>
      <small>Con sonido se disfruta más. En teléfono, use el modo horizontal.</small>
    </div>
  </div>

  <div id="touch" hidden>
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="tbtns">
      <button id="tb-run" aria-label="Correr">Correr</button>
      <button id="tb-a" aria-label="Acción">A</button>
    </div>
  </div>

  <div id="layer"></div>
  <div id="toast"></div>
  <div id="rotate" hidden><div><i class="rot-phone" aria-hidden="true"></i>Gire el teléfono a horizontal para jugar más cómodo.</div></div>
  <pre id="autotest" hidden></pre>
</div>
